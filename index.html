<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#58734A">
<title>Hafa Florist - Form Order</title>
<style>
:root{--g:#58734A;--d:#40583A;--s:#EEF4E9;--gold:#C8A85B;--t:#263126;--m:#718071;--b:#DCE5D7}
*{box-sizing:border-box}body{margin:0;padding:15px 9px 45px;font-family:Arial,sans-serif;color:var(--t);background:linear-gradient(135deg,#F8F8F1,#EDF3E8)}
.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:27px;overflow:hidden;box-shadow:0 18px 55px #35483022}
.head{padding:29px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--d),var(--g))}
.logo{font-size:29px;font-weight:800}.logo span{color:#F5D98A}.sub{font-size:13px;margin-top:7px}
.form{padding:23px}.sec{padding:18px;margin-bottom:18px;border:1px solid var(--b);border-radius:19px}.sec.pay{background:linear-gradient(135deg,#F4F8EF,#FFFDF7)}
h3{margin:0 0 16px;color:var(--d);font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#4d5c4c}
input,select,textarea{width:100%;padding:12px;border:1px solid #D9E1D4;border-radius:11px;background:#FCFDFB;font-size:14px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #58734a1a}textarea{min-height:82px;resize:vertical}
.money{position:relative}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--m);font-size:13px}.money input{padding-left:39px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #D9E2D4;font-size:14px}
.rem{margin-top:11px;padding:15px;border-radius:14px;background:var(--d);color:#fff;display:flex;justify-content:space-between}.rem strong{color:#F6DC93;font-size:19px}
.status{margin-top:11px;padding:10px;text-align:center;border-radius:10px;font-weight:700;font-size:13px;background:#F0F2EE}.dp{background:#FFF5D8;color:#92712C}.lunas{background:#E5F3E5;color:#3F7140}.err{background:#FBE4E2;color:#B94A48}
button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--d));color:#fff;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}
.result{display:none;margin-top:13px;padding:13px;border-radius:12px;background:#E9F5E9;color:#3F7140;text-align:center;font-weight:700}.note{text-align:center;color:var(--m);font-size:12px;line-height:1.55;margin-top:12px}
@media(max-width:600px){.form{padding:13px}.sec{padding:15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.logo{font-size:25px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="head"><div class="logo">🌷 Hafa <span>Florist</span></div><div class="sub">Form Order • Bouquet Custom • Cisarua Puncak</div></div>
<form class="form" id="form">
<div class="sec"><h3>👤 Data Pemesan</h3><div class="grid">
<div><label>Nama Pemesan *</label><input id="nama" required placeholder="Nama pemesan"></div>
<div><label>No. WhatsApp *</label><input id="wa" type="tel" required placeholder="08xxxxxxxxxx"></div>
</div></div>
<div class="sec"><h3>💐 Detail Pesanan</h3><div class="grid">
<div><label>Jenis Pesanan *</label><select id="jenis" required><option value="">Pilih jenis pesanan</option><option>Buket Bunga</option><option>Buket Uang</option><option>Buket Snack</option><option>Buket Boneka</option><option>Buket Custom</option><option>Mahar Nikah</option><option>Make Up Graduation</option><option>Make Up Event</option></select></div>
<div><label>Tanggal Dibutuhkan *</label><input id="tanggal" type="date" required></div>
<div><label>Jam</label><input id="jam" type="time"></div>
<div><label>Pengambilan / Pengiriman</label><select id="ambil"><option>Ambil di tempat</option><option>Diantar</option></select></div>
<div><label>Warna / Tema</label><input id="tema" placeholder="Contoh: sage green & cream"></div>
<div><label>Budget</label><input id="budget" placeholder="Contoh: Rp100.000"></div>
<div class="full"><label>Tulisan / Ucapan</label><textarea id="ucapan" placeholder="Tuliskan ucapan..."></textarea></div>
<div class="full"><label>Catatan / Request</label><textarea id="catatan" placeholder="Detail tambahan pesanan..."></textarea></div>
</div></div>
<div class="sec pay"><h3>💳 Pembayaran</h3><div class="grid">
<div><label>Total Harga *</label><div class="money"><span>Rp</span><input id="total" type="number" min="0" required placeholder="0"></div></div>
<div><label>DP *</label><div class="money"><span>Rp</span><input id="dp" type="number" min="0" required placeholder="0"></div></div>
</div>
<div class="row"><span>Total Pesanan</span><strong id="tt">Rp0</strong></div>
<div class="row"><span>DP</span><strong id="dt">Rp0</strong></div>
<div class="rem"><span>Sisa Pelunasan</span><strong id="st">Rp0</strong></div>
<div id="ps" class="status">Belum ada pembayaran</div></div>
<button id="btn">📲 Simpan & Kirim Pesanan</button>
<div id="result" class="result"></div>
<div class="note">Pesanan dicatat ke Google Sheets dan rincian order dibuka di WhatsApp Hafa Florist.<br>Pesanan diproses setelah DP diterima.</div>
</form></div></div>
<script>
/* GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT */
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxtG4SYgxSyx7JKhnJAJmXQ5YbIHaUU3iwEkJpETgT0HYmZveoJjoQTWBSCLhp5bAE/exec";
const WA_HAFA="628985643104";
const $=id=>document.getElementById(id);
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
function pay(){let t=+$("total").value||0,d=+$("dp").value||0,s=Math.max(t-d,0);$("tt").textContent=rp(t);$("dt").textContent=rp(d);$("st").textContent=rp(s);let x=$("ps");x.className="status";if(d>t&&t>0){x.textContent="⚠️ DP lebih besar dari total harga";x.classList.add("err")}else if(t>0&&d===t){x.textContent="✓ LUNAS";x.classList.add("lunas")}else if(d>0){x.textContent="✓ DP SUDAH DIBAYAR";x.classList.add("dp")}else{x.textContent="Belum ada pembayaran"}}
$("total").oninput=pay;$("dp").oninput=pay;pay();
$("form").onsubmit=async e=>{e.preventDefault();if(SCRIPT_URL.includes("PASTE_URL")){alert("Masukkan URL Web App Google Apps Script terlebih dahulu.");return}let t=+$("total").value||0,d=+$("dp").value||0;if(t<=0){alert("Total harga harus diisi.");return}if(d>t){alert("DP tidak boleh lebih besar dari total harga.");return}let data={nama:$("nama").value.trim(),wa:$("wa").value.trim(),jenis:$("jenis").value,budget:$("budget").value.trim(),tema:$("tema").value.trim(),ucapan:$("ucapan").value.trim(),tanggal:$("tanggal").value,jam:$("jam").value,ambil:$("ambil").value,catatan:$("catatan").value.trim(),total_harga:t,dp:d};$("btn").disabled=true;$("btn").textContent="⏳ Menyimpan pesanan...";try{let r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});let j=await r.json();if(!j.success)throw new Error(j.message||"Gagal menyimpan");let msg=`🌷 *FORM ORDER HAFA FLORIST*

*NO. ORDER*
${j.nomor_order}

*DATA PEMESAN*
Nama: ${data.nama}
No. WhatsApp: ${data.wa}

*DETAIL PESANAN*
Jenis: ${data.jenis}
Budget: ${data.budget||"-"}
Warna/Tema: ${data.tema||"-"}
Tanggal: ${data.tanggal}
Jam: ${data.jam||"-"}
Pengambilan: ${data.ambil}

*UCAPAN*
${data.ucapan||"-"}

*CATATAN / REQUEST*
${data.catatan||"-"}

*PEMBAYARAN*
Total Harga: ${rp(j.total_harga)}
DP: ${rp(j.dp)}
Sisa Pelunasan: ${rp(j.sisa_pelunasan)}
Status: ${j.status_pembayaran}

Mohon konfirmasi pesanan saya. Terima kasih 🤍`;$("result").style.display="block";$("result").textContent="✅ Order "+j.nomor_order+" berhasil disimpan.";window.open("https://wa.me/"+WA_HAFA+"?text="+encodeURIComponent(msg),"_blank");$("form").reset();pay()}catch(err){alert("Gagal menyimpan pesanan. Pastikan URL Apps Script benar, Web App aktif, dan aksesnya Anyone.\n\n"+err.message)}finally{$("btn").disabled=false;$("btn").textContent="📲 Simpan & Kirim Pesanan"}};
</script>
</body>
</html>
